spring.application.name=marketplace

# Base URL of the frontend used to build email verification/password reset links
app.frontend-url=http://localhost:3000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true

# Active profile: 'local' is used for local development (connects to Supabase).
# In production, override via env var: SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=local

# JWT defaults (override via env vars or profile-specific properties in production)
jwt.secret=CHANGE_ME_IN_PRODUCTION
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# HikariCP connection pool tuning for Supabase pooler
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# Comma-separated frontend origins allowed by CORS
app.cors.allowed-origins=http://localhost:3000

# File upload limits (for product images)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB