spring.datasource.url=YOUR_DATABASE_URL
spring.datasource.username=YOUR_USERNAME
spring.datasource.password=YOUR_PASSWORD

jwt.secret=YOUR_JWT_SECRET
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Base URL of the frontend used to build email verification/password reset links
app.frontend-url=http://localhost:3000

# Checkout pricing rules (optional; defaults: $5 flat shipping, free above $50, 8% tax)
app.checkout.shipping-flat-rate=5.00
app.checkout.free-shipping-threshold=50.00
app.checkout.tax-rate=0.08